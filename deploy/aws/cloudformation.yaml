AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Alpha Analyst — ECS Fargate deployment with ALB, ECR, and Secrets Manager.
  Deploys Gateway (public API), Ingestion (background worker), and RAG Hub
  (AI pipeline) as containerized services.

Parameters:
  EnvironmentName:
    Type: String
    Default: production
    AllowedValues: [production, staging]
  VpcCIDR:
    Type: String
    Default: "10.0.0.0/16"
  GatewayCpu:
    Type: String
    Default: "256"
  GatewayMemory:
    Type: String
    Default: "512"
  IngestionCpu:
    Type: String
    Default: "256"
  IngestionMemory:
    Type: String
    Default: "512"
  RagHubCpu:
    Type: String
    Default: "512"
  RagHubMemory:
    Type: String
    Default: "1024"
  GatewayDesiredCount:
    Type: Number
    Default: 2
  IngestionDesiredCount:
    Type: Number
    Default: 1
  RagHubDesiredCount:
    Type: Number
    Default: 1
  GatewayImageTag:
    Type: String
    Default: latest
  IngestionImageTag:
    Type: String
    Default: latest
  RagHubImageTag:
    Type: String
    Default: latest

Resources:
  # ──────────────────────────── VPC & Networking ────────────────────────────
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCIDR
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-alpha-analyst-vpc"

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: "10.0.1.0/24"
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-public-1"

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: "10.0.2.0/24"
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-public-2"

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: "10.0.3.0/24"
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-private-1"

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: "10.0.4.0/24"
      AvailabilityZone: !Select [1, !GetAZs ""]
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-private-2"

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: "0.0.0.0/0"
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  NatEIP:
    Type: AWS::EC2::EIP
    DependsOn: GatewayAttachment

  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEIP.AllocationId
      SubnetId: !Ref PublicSubnet1

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC

  PrivateRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: "0.0.0.0/0"
      NatGatewayId: !Ref NatGateway

  PrivateSubnet1RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnet2RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable

  # ──────────────────────────── Security Groups ────────────────────────────
  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ALB ingress
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: "0.0.0.0/0"
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: "0.0.0.0/0"

  ECSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ECS tasks
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref ALBSecurityGroup

  # ──────────────────────────── ECR Repositories ────────────────────────────
  GatewayRepo:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub "${EnvironmentName}/alpha-analyst-gateway"
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules":[{"rulePriority":1,"selection":{"tagStatus":"untagged","countType":"sinceImagePushed","countUnit":"days","countNumber":14},"action":{"type":"expire"}}]}

  IngestionRepo:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub "${EnvironmentName}/alpha-analyst-ingestion"
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules":[{"rulePriority":1,"selection":{"tagStatus":"untagged","countType":"sinceImagePushed","countUnit":"days","countNumber":14},"action":{"type":"expire"}}]}

  RagHubRepo:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub "${EnvironmentName}/alpha-analyst-rag-hub"
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules":[{"rulePriority":1,"selection":{"tagStatus":"untagged","countType":"sinceImagePushed","countUnit":"days","countNumber":14},"action":{"type":"expire"}}]}

  # ──────────────────────────── Secrets Manager ────────────────────────────
  AzureSecrets:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${EnvironmentName}/alpha-analyst/azure-credentials"
      Description: Azure service credentials for Alpha Analyst
      SecretString: '{"AZURE_OPENAI_ENDPOINT":"","AZURE_OPENAI_API_KEY":"","AZURE_OPENAI_MODEL":"","AZURE_OPENAI_EMBEDDING_MODEL":"","AZURE_AI_SEARCH_ENDPOINT":"","AZURE_AI_SEARCH_KEY":""}'

  # ──────────────────────────── ECS Cluster ────────────────────────────
  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "${EnvironmentName}-alpha-analyst"
      ClusterSettings:
        - Name: containerInsights
          Value: enabled

  # ──────────────────────────── IAM ────────────────────────────
  ECSTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: SecretsAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref AzureSecrets

  ECSTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole

  # ──────────────────────────── CloudWatch Log Groups ────────────────────────────
  GatewayLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${EnvironmentName}/alpha-analyst-gateway"
      RetentionInDays: 30

  IngestionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${EnvironmentName}/alpha-analyst-ingestion"
      RetentionInDays: 30

  RagHubLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${EnvironmentName}/alpha-analyst-rag-hub"
      RetentionInDays: 30

  # ──────────────────────────── ALB ────────────────────────────
  ALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "${EnvironmentName}-alpha-analyst"
      Scheme: internet-facing
      Type: application
      Subnets:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2
      SecurityGroups:
        - !Ref ALBSecurityGroup

  ALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ALB
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref GatewayTargetGroup

  GatewayTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "${EnvironmentName}-gateway-tg"
      Port: 8080
      Protocol: HTTP
      VpcId: !Ref VPC
      TargetType: ip
      HealthCheckPath: /weatherforecast
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3

  # ──────────────────────────── Task Definitions ────────────────────────────
  GatewayTaskDef:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${EnvironmentName}-alpha-analyst-gateway"
      Cpu: !Ref GatewayCpu
      Memory: !Ref GatewayMemory
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt ECSTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt ECSTaskRole.Arn
      ContainerDefinitions:
        - Name: gateway
          Image: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${GatewayRepo}:${GatewayImageTag}"
          PortMappings:
            - ContainerPort: 8080
              Protocol: tcp
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref GatewayLogGroup
              awslogs-region: !Ref "AWS::Region"
              awslogs-stream-prefix: gateway
          Environment:
            - Name: ASPNETCORE_URLS
              Value: "http://+:8080"
            - Name: ASPNETCORE_ENVIRONMENT
              Value: Production

  IngestionTaskDef:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${EnvironmentName}-alpha-analyst-ingestion"
      Cpu: !Ref IngestionCpu
      Memory: !Ref IngestionMemory
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt ECSTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt ECSTaskRole.Arn
      ContainerDefinitions:
        - Name: ingestion
          Image: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${IngestionRepo}:${IngestionImageTag}"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref IngestionLogGroup
              awslogs-region: !Ref "AWS::Region"
              awslogs-stream-prefix: ingestion

  RagHubTaskDef:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${EnvironmentName}-alpha-analyst-rag-hub"
      Cpu: !Ref RagHubCpu
      Memory: !Ref RagHubMemory
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt ECSTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt ECSTaskRole.Arn
      ContainerDefinitions:
        - Name: rag-hub
          Image: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${RagHubRepo}:${RagHubImageTag}"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref RagHubLogGroup
              awslogs-region: !Ref "AWS::Region"
              awslogs-stream-prefix: rag-hub
          Secrets:
            - Name: AZURE_OPENAI_ENDPOINT
              ValueFrom: !Sub "${AzureSecrets}:AZURE_OPENAI_ENDPOINT::"
            - Name: AZURE_OPENAI_API_KEY
              ValueFrom: !Sub "${AzureSecrets}:AZURE_OPENAI_API_KEY::"
            - Name: AZURE_OPENAI_MODEL
              ValueFrom: !Sub "${AzureSecrets}:AZURE_OPENAI_MODEL::"
            - Name: AZURE_OPENAI_EMBEDDING_MODEL
              ValueFrom: !Sub "${AzureSecrets}:AZURE_OPENAI_EMBEDDING_MODEL::"
            - Name: AZURE_AI_SEARCH_ENDPOINT
              ValueFrom: !Sub "${AzureSecrets}:AZURE_AI_SEARCH_ENDPOINT::"
            - Name: AZURE_AI_SEARCH_KEY
              ValueFrom: !Sub "${AzureSecrets}:AZURE_AI_SEARCH_KEY::"

  # ──────────────────────────── ECS Services ────────────────────────────
  GatewayService:
    Type: AWS::ECS::Service
    DependsOn: ALBListener
    Properties:
      ServiceName: gateway
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref GatewayTaskDef
      DesiredCount: !Ref GatewayDesiredCount
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets:
            - !Ref PrivateSubnet1
            - !Ref PrivateSubnet2
          SecurityGroups:
            - !Ref ECSSecurityGroup
      LoadBalancers:
        - ContainerName: gateway
          ContainerPort: 8080
          TargetGroupArn: !Ref GatewayTargetGroup

  IngestionService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: ingestion
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref IngestionTaskDef
      DesiredCount: !Ref IngestionDesiredCount
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets:
            - !Ref PrivateSubnet1
            - !Ref PrivateSubnet2
          SecurityGroups:
            - !Ref ECSSecurityGroup

  RagHubService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: rag-hub
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref RagHubTaskDef
      DesiredCount: !Ref RagHubDesiredCount
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets:
            - !Ref PrivateSubnet1
            - !Ref PrivateSubnet2
          SecurityGroups:
            - !Ref ECSSecurityGroup

Outputs:
  ALBDNSName:
    Description: Public DNS of the Application Load Balancer (Gateway API)
    Value: !GetAtt ALB.DNSName

  GatewayURL:
    Description: Gateway API URL
    Value: !Sub "http://${ALB.DNSName}/weatherforecast"

  ECSClusterName:
    Description: ECS Cluster name
    Value: !Ref ECSCluster

  GatewayECR:
    Description: Gateway ECR repository URI
    Value: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${GatewayRepo}"

  IngestionECR:
    Description: Ingestion ECR repository URI
    Value: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${IngestionRepo}"

  RagHubECR:
    Description: RAG Hub ECR repository URI
    Value: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${RagHubRepo}"

  SecretsARN:
    Description: ARN of the Secrets Manager secret for Azure credentials
    Value: !Ref AzureSecrets
